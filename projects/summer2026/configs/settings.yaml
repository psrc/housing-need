census_key: CENSUS_KEY
data_dir: data
output_dir: output
county_ids: [53033, 53035, 53053, 53061]
county_map:
  King County: 53033
  Kitsap County: 53035
  Pierce County: 53053
  Snohomish County: 53061
state_id: 53

pums_type: 1-Year
pums_year: 2024

gq_rates_year: 2020
headship_rates_year: 2000
vacancy_rates_year: 2020
most_recent_decennial_year: 2020

data:
  ofm_population_estimates: ofm_pop_sade_county_2020_2025.xlsx
  ofm_housing_estimates: ofm_april1_housing.xlsx
  current_homelessness_counts: PIT2026.csv
  homeless_families_counts: PIT2024_CoC.csv
  school_districts: school_districts.csv
  mvs_data: MVS_data_WA.csv
  hud_chas: Renter_Cost_Burden_HUD_CHAS_2022.xlsx
  hud_chas_t18c: CHAS_2022_Table18C_county.csv
  hud_income_limits: Section8-FY24.xlsx

remi_forecast_dir: J:/Projects/Forecasts/_Regional/2026/REMI
remi_forecast: REMI_v3.4_base_adj_to_OFM.xlsx
forecast_year: 2060

split_need_ami:
  income_levels: ['0-30%', '>30-50%', '>50-80%', '>80-100%', '>100-120%', '>120%']
  cost_burden_build_years: 25 # share of cost-burden need built each year is 1/this
  homeless_income_split: # share of homeless households needing housing at each income level
    '0-30%': 0.9
    '>30-50%': 0.1
  moderate_income_upper_ami: 1.2 # top of the second-highest income level, as a ratio of AMI
  hud_income_limits_year: 2024 # matches the dollar year of the PUMS incomes
  hamfi_size_factors: # HUD household-size adjustment to the 4-person median family income
    1: 0.70
    2: 0.80
    3: 0.90
    4: 1.00
    5: 1.08
    6: 1.16
    7: 1.24
    8: 1.32
  output_file: housing_need_by_income.xlsx

steps:
  - housing_need.steps.clean_ofm_estimates # leave this step on to populate context['ofm_year']
